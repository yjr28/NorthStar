name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
  control-plane:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: control-plane } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-test-reports
          path: control-plane/target/surefire-reports/
          if-no-files-found: ignore
  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool observability/grafana/dashboards/northstar-control-plane.json >/dev/null
