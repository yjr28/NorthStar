server:
  port: ${PORT:8080}
spring:
  application:
    name: northstar-control-plane
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/northstar}
    username: ${DATABASE_USER:northstar}
    password: ${DATABASE_PASSWORD:northstar}
  sql:
    init:
      mode: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
northstar:
  security:
    operator-api-key: ${NORTHSTAR_OPERATOR_API_KEY:}
    operator-read-api-key: ${NORTHSTAR_OPERATOR_READ_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
